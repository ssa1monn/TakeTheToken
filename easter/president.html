<!doctype html>
<!--
  총장 시뮬레이터 — 원작: SW 브랜치 president-simulator.html (SangWon Park)
  게임 안에서는 대학본부 총장실 이스터에그로 iframe에 띄운다 (easter/president.js).
  게임에 붙이면서 바꾼 것: 나가기 버튼, 임기 결과를 부모 창에 postMessage로 전달. 그 외 원본 그대로.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>총장 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 총장실 책상 — 좌 결재 공문(시그니처: 결재 도장), 우 익명게시판 실시간 여론. 상단 국정 게이지 */
:root{
  --desk:#dfe4ea; --paper:#ffffff; --rule:#cfd6df; --ink:#16202c; --muted:#5c6878;
  --seal:#c3172f; --seal-soft:#fbe5e8; --good:#1d7a4e; --bad:#c3172f; --navy:#132a45; --navy-ink:#f2f5f9; --gold:#b8862b;
  --f-doc:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-stamp:"Black Han Sans","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0e1319; --paper:#171e27; --rule:#2a3441; --ink:#e5eaf1; --muted:#909bab;
  --seal:#ff4d63; --seal-soft:#3b1820; --good:#4cc48a; --bad:#ff6b7c; --navy:#0a1a2e; --navy-ink:#e5eaf1; --gold:#e0b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0e1319; --paper:#171e27; --rule:#2a3441; --ink:#e5eaf1; --muted:#909bab;
  --seal:#ff4d63; --seal-soft:#3b1820; --good:#4cc48a; --bad:#ff6b7c; --navy:#0a1a2e; --navy-ink:#e5eaf1; --gold:#e0b45a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55}
button,input{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--navy);color:var(--navy-ink)}
.hbar{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;padding-block:14px}
.brand{font-family:var(--f-doc);font-weight:800;font-size:22px;line-height:1.1}
.brand small{display:block;font-family:var(--f-ui);font-weight:400;font-size:12px;opacity:.7}
.gauges{display:flex;flex-wrap:wrap;gap:10px 26px;margin-left:auto}
.g{min-width:110px}
.g .l{font-size:11px;letter-spacing:.08em;opacity:.7}
.g .v{font-family:var(--f-num);font-size:20px;font-weight:600;line-height:1.2;display:flex;align-items:baseline;gap:6px}
.g .d{font-size:12px}
.g .track{height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:4px;overflow:hidden}
.g .track i{display:block;height:100%;background:var(--gold);transition:width .6s}
.d.up{color:#6fe0a4} .d.dn{color:#ff8d9b}

main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding-block:16px}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}

/* 공문 */
.doc{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:26px 28px 24px;box-shadow:0 1px 0 var(--rule),0 10px 30px -18px rgba(10,20,35,.35);overflow:hidden}
@media (max-width:520px){.doc{padding:20px 16px}}
.doc-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:8px}
.doc h1{font-family:var(--f-doc);font-weight:800;font-size:clamp(22px,3.2vw,30px);line-height:1.3;margin:18px 0 6px;text-wrap:balance}
.meta-table{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:12px 0 16px;padding:10px 0;border-block:1px solid var(--rule)}
.meta-table dt{color:var(--muted)} .meta-table dd{margin:0}
.body{font-size:15px;max-width:62ch}
.body p{margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;text-align:left;padding:12px 14px;border:1px solid var(--rule);border-radius:4px;background:transparent;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink);background:var(--desk)}
.opt:disabled{cursor:default;opacity:.45}
.opt.chosen{opacity:1;border-color:var(--seal);background:var(--seal-soft)}
.opt .k{font-family:var(--f-doc);font-weight:800;font-size:18px;line-height:1.2}
.opt b{display:block;font-size:14.5px}
.opt span{font-size:12.5px;color:var(--muted)}
.free{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.free input{flex:1 1 240px;min-width:0;padding:11px 12px;border:1px dashed var(--muted);border-radius:4px;background:transparent}
.btn{border:0;border-radius:4px;padding:11px 18px;font-weight:700;background:var(--ink);color:var(--paper)}
.btn.seal{background:var(--seal);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.sign{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:22px;font-family:var(--f-doc);font-weight:700}
.sign .box{width:76px;height:76px;border:1px solid var(--rule);display:grid;place-items:center;font-size:11px;color:var(--muted);font-family:var(--f-ui)}
.stamp{position:absolute;right:34px;bottom:22px;width:118px;height:118px;border:5px solid var(--seal);border-radius:50%;color:var(--seal);display:grid;place-items:center;text-align:center;font-family:var(--f-stamp);font-size:30px;line-height:1;transform:rotate(-14deg);opacity:.88;pointer-events:none;mix-blend-mode:multiply}
:root[data-theme="dark"] .stamp{mix-blend-mode:normal}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp{mix-blend-mode:normal}}
.stamp small{display:block;font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.1em;margin-top:4px}
.stamp.hit{animation:stamp .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{0%{transform:rotate(-24deg) scale(2.3);opacity:0}70%{opacity:.95}100%{transform:rotate(-14deg) scale(1);opacity:.88}}
.aide{margin-top:16px;padding:12px 14px;border-left:3px solid var(--gold);background:var(--desk);font-size:13px}
.aide b{color:var(--gold)}
.next{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.note{font-size:11.5px;color:var(--muted)}

/* 게시판 */
.board{background:var(--paper);border:1px solid var(--rule);border-radius:4px;display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 140px);position:sticky;top:16px}
@media (max-width:900px){.board{position:static;max-height:none}}
.bh{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:10px}
.bh h2{margin:0;font-size:15px}
.mood{padding:10px 16px;border-bottom:1px solid var(--rule)}
.mood .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.mbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px;background:var(--rule)}
.mbar i{display:block;height:100%;transition:width .5s}
.posts{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.posts li{padding:12px 16px;border-bottom:1px solid var(--rule);animation:pin .4s ease-out}
@keyframes pin{from{background:var(--seal-soft)}}
.who{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.who .tagp{font-weight:700;color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:0 6px}
.who .hot{color:#fff;background:var(--seal);border-radius:3px;padding:0 5px;font-weight:700;font-size:10.5px}
.txt{margin:3px 0 4px;font-size:14px;text-wrap:pretty}
.likes{font-size:12px;color:var(--seal);font-family:var(--f-num)}
.empty{padding:28px 16px;color:var(--muted);font-size:13px}
.typing{padding:10px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule)}

/* 엔딩 */
.ending{grid-column:1/-1}
.end-doc h1{font-size:clamp(26px,4vw,38px)}
.verdict{font-family:var(--f-stamp);font-size:clamp(26px,4vw,40px);color:var(--seal);margin:4px 0 12px;line-height:1.15}
.end-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:10px}
@media (max-width:760px){.end-grid{grid-template-columns:minmax(0,1fr)}}
.chart{height:200px} canvas{display:block;width:100%;height:100%}
.report{list-style:none;padding:0;margin:0;counter-reset:r}
.report li{padding:10px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.report li b{display:block}
.report .q{color:var(--muted);font-size:12.5px}
.end-doc .stamp{top:70px;bottom:auto;right:28px}
.end-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn.exit{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--navy-ink);padding:8px 14px}
@media (prefers-reduced-motion:reduce){.stamp.hit,.posts li{animation:none}.g .track i,.mbar i{transition:none}}
</style>
</head>
<body>


<header>

  const g = [["지지율", S.sup+"%", S.sup, lastD.sup, "%p"], ["가용 예산", S.bud+"억", S.bud*2.5, lastD.bud, "억"], ["학업 평판", S.aca, S.aca, lastD.aca, ""], ["남은 안건", Math.max(0,AGENDAS.length-S.i)+"/"+AGENDAS.length, (AGENDAS.length-S.i)/AGENDAS.length*100, 0, ""]];
  $("gauges").innerHTML = g.map(([l,v,w,d,u])=>`<div class="g"><div class="l">${l}</div><div class="v">${v}${d?`<span class="d ${d>0?"up":"dn"}">${d>0?"▲":"▼"}${Math.abs(d)}${u}</span>`:""}</div><div class="track"><i style="width:${clamp(w,0,100)}%"></i></div></div>`).join("");
}
function clock(){ const m = 9*60 + S.i*95; return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`; }

function renderDoc(){
  const a = AGENDAS[S.i];
  $("main").innerHTML = `
  <section class="doc" id="doc">
    <div class="doc-top"><span>인천대학교 총장실 · 결재 문서</span><span class="num">${a.no} · 임기 1일차 ${clock()}</span></div>
    <h1>${a.title}</h1>
    <dl class="meta-table"><dt>기안 부서</dt><dd>${a.from}</dd><dt>수신</dt><dd>총장</dd><dt>결재 순서</dt><dd>안건 ${S.i+1} / ${AGENDAS.length} <span style="color:var(--muted)">(전체 ${POOL.length}건 중 오늘 무작위로 올라온 안건)</span></dd></dl>
    <div class="body">${a.body.map(p=>`<p>${p}</p>`).join("")}</div>
    <div class="opts" id="opts">${a.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${o.k}</span><span><b>${o.t}</b><span>${o.s}</span></span></button>`).join("")}</div>
    <form class="free" id="free"><input id="freeIn" maxlength="60" placeholder="직접 지시하기: 예) 학생회와 공청회를 열고 다음 주에 결정" autocomplete="off" aria-label="직접 지시"><button class="btn" type="submit">지시</button></form>
    <div id="after"></div>
    <div class="sign"><span>총장</span><div class="box">서명란</div></div>
    <div id="stampSlot"></div>
  </section>
  <section class="board" aria-label="익명게시판">
    <div class="bh"><h2>캠퍼스 익명게시판</h2><span class="note">AI 학생 ${PERSONAS.length}명 접속 중</span></div>
    <div class="mood"><div class="row"><span>실시간 여론</span><span class="num" id="moodTxt">공감 0 · 비공감 0</span></div>
      <div class="mbar"><i id="mPos" style="width:50%;background:var(--good)"></i><i id="mNeg" style="width:50%;background:var(--bad)"></i></div></div>
    <div id="typing"></div>
    <ul class="posts" id="posts"><li class="empty" id="emptyPost">총장의 결재를 기다리는 중입니다. 결정이 나면 학생들이 바로 반응합니다.</li></ul>
  </section>`;
  $("opts").onclick = e=>{ const b=e.target.closest(".opt"); if(b && !S.busy) decide(a.opts[b.dataset.k], +b.dataset.k); };
  $("free").onsubmit = e=>{ e.preventDefault(); const t=$("freeIn").value.trim(); if(t && !S.busy) decideFree(t); };
  (S.prevPosts||[]).forEach(p=>addPost(...p, true));
  updateMood();
}

function apply(d){
  lastD = d;
  S.sup = clamp(S.sup+d.sup,0,100); S.bud = S.bud+d.bud; S.aca = clamp(S.aca+d.aca,0,100);
  S.hist.push(S.sup); renderGauges();
}
function stamp(){
  $("stampSlot").innerHTML = `<div class="stamp hit">결재<small>총장</small></div>`;
}
function lockOpts(chosenIdx){
  document.querySelectorAll(".opt").forEach((b,k)=>{ b.disabled=true; if(k===chosenIdx) b.classList.add("chosen"); });
  $("freeIn").disabled=true; $("free").querySelector("button").disabled=true;
}
function decide(o, idx){
  S.busy=true; lockOpts(idx); stamp(); apply(o.d);
  const a=AGENDAS[S.i];
  S.log.push({title:a.title, choice:`${o.k}. ${o.t}`, d:o.d, best:[...o.r].sort((x,y)=>y[2]-x[2])[0]});
  aide(`'${o.t}' 결재 완료. 지지율 ${o.d.sup>=0?"+":""}${o.d.sup}%p, 예산 ${o.d.bud>=0?"+":""}${o.d.bud}억, 학업 평판 ${o.d.aca>=0?"+":""}${o.d.aca}.`);
  streamReactions(o.r, o.d.sup);
}
function decideFree(text){
  const hits = FREE_RULES.filter(r=>r.re.test(text));
  const d = hits.reduce((acc,r)=>({sup:acc.sup+r.d.sup,bud:acc.bud+r.d.bud,aca:acc.aca+r.d.aca}),{sup:0,bud:0,aca:0});
  if(!hits.length) d.sup = -1;
  S.busy=true; lockOpts(-1); stamp(); apply(d);
  const pool = d.sup>2?FREE_REACT.pos:d.sup<0?FREE_REACT.neg:FREE_REACT.mid;
  const r = [[1,`"${text}" 이거 공지 뜬 거 실화?`,150+Math.floor(Math.random()*120)], ...pool];
  S.log.push({title:AGENDAS[S.i].title, choice:`직접 지시: ${text}`, d, best:r[0]});
  aide(`${hits.length?hits.map(h=>h.v).join(" "):"뚜렷한 방향이 없는 지시로 해석했습니다."} 지지율 ${d.sup>=0?"+":""}${d.sup}%p.`);
  streamReactions(r, d.sup);
}
function aide(msg){
  $("after").innerHTML = `<div class="aide"><b>비서실 AI</b> · ${esc(msg)}</div>`;
}
function addPost(pi, text, likes, quiet){
  const e=$("emptyPost"); if(e) e.remove();
  const p=PERSONAS[pi], li=document.createElement("li");
  li.innerHTML=`<div class="who"><span class="tagp">${p.official?"학생회":"익명"}</span><span>${p.official?"공식 계정":p.tag}</span>${likes>=300?'<span class="hot">HOT</span>':""}</div><div class="txt"></div><div class="likes">공감 <span class="num">0</span></div>`;
  li.querySelector(".txt").textContent=text;
  if(quiet) li.style.animation="none";
  $("posts").prepend(li);
  const el=li.querySelector(".likes .num"); let n=quiet?likes:0;
  if(quiet){ el.textContent=likes; return; }
  const step=Math.max(1,Math.round(likes/18)); const t=setInterval(()=>{ n=Math.min(likes,n+step); el.textContent=n; if(n>=likes) clearInterval(t); },60);
}
function updateMood(){
  const tot=S.pos+S.neg||1;
  if(!$("mPos")) return;
  $("mPos").style.width=(S.pos/tot*100||50)+"%"; $("mNeg").style.width=(S.neg/tot*100||50)+"%";
  $("moodTxt").textContent=`공감 ${S.pos.toLocaleString()} · 비공감 ${S.neg.toLocaleString()}`;
}
function streamReactions(list, sup){
  S.prevPosts = S.prevPosts||[];
  list.forEach((r,k)=>{
    setTimeout(()=>{ $("typing").innerHTML=`<div class="typing">익명 학생이 글을 쓰는 중…</div>`; }, k*1100+200);
    setTimeout(()=>{
      $("typing").innerHTML=""; addPost(r[0], r[1], r[2]); S.prevPosts.push(r);
      if(sup>=0) S.pos+=r[2]; else S.neg+=r[2];
      updateMood();
      if(k===list.length-1) showNext();
    }, k*1100+900);
  });
}
function showNext(){
  S.busy=false;
  const last = S.i===AGENDAS.length-1;
  $("after").insertAdjacentHTML("beforeend", `<div class="next"><span class="note">데모: 반응은 미리 쓴 예시입니다. 실제 버전은 LLM이 학생 페르소나별로 반응을 생성합니다.</span><button class="btn seal" id="nextBtn">${last?"임기 평가 보기":"다음 안건"}</button></div>`);
  $("nextBtn").onclick = ()=>{ S.i++; lastD={sup:0,bud:0,aca:0}; if(S.i>=AGENDAS.length) ending(); else { renderGauges(); renderDoc(); window.scrollTo({top:0,behavior:"smooth"}); } };
}

function ending(){
  renderGauges();
  const v = S.bud<0 ? ["재정 파탄 총장","학생들은 행복했지만 기획처가 사표를 냈습니다."]
    : S.sup>=70 ? ["전설의 총장","총학생회가 동상 건립을 추진합니다."]
    : S.sup>=50 ? ["무난한 총장","익명게시판에 '그래도 전 총장보단 낫다'는 글이 올라왔습니다."]
    : S.sup>=30 ? ["면담 요청 받은 총장","학생회가 다음 주 면담을 요청했습니다."]
    : ["탄핵 서명 진행 중","익명게시판에서 서명 운동이 시작됐습니다."];
  const report = S.log.map((l,k)=>`안건 ${k+1}. ${l.title}\n- 결정: ${l.choice}\n- 지지율 변화: ${l.d.sup>=0?"+":""}${l.d.sup}%p\n- 대표 학생 의견: "${l.best[1]}" (공감 ${l.best[2]})`).join("\n\n");
  $("main").innerHTML = `<section class="doc end-doc ending">
    <div class="doc-top"><span>인천대학교 총장실 · 임기 평가서</span><span class="num">임기 1일차 18:00</span></div>
    <h1>하루 총장 임기가 끝났습니다</h1>
    <div class="verdict">${v[0]}</div>
    <p class="body">${v[1]} 최종 지지율 <b class="num">${S.sup}%</b>, 남은 예산 <b class="num">${S.bud}억</b>, 학업 평판 <b class="num">${S.aca}</b>.</p>
    <div class="end-grid">
      <div><div class="note">지지율 추이</div><div class="chart"><canvas id="supChart" role="img" aria-label="안건별 지지율 추이"></canvas></div></div>
      <div><div class="note">학생회 전달용 정책 제안서</div><ol class="report">${S.log.map((l,k)=>`<li><b>${k+1}. ${l.title}</b>${esc(l.choice)}<div class="q">대표 의견 "${esc(l.best[1])}" · 공감 ${l.best[2]}</div></li>`).join("")}</ol></div>
    </div>
    <div class="end-actions">${EMBED?`<button class="btn seal" id="leaveBtn">총장 의자에서 일어나기</button>`:""}<button class="btn${EMBED?"":" seal"}" id="copyBtn">제안서 복사</button><button class="btn" id="againBtn">새 안건으로 다시 하기</button></div>
    <p class="note">실제 버전에서는 플레이어 수백 명의 결정과 AI 학생 여론을 모아, 학생들이 가장 많이 고른 해결책을 학생회 정책 제안 리포트로 정리합니다.</p>
    <div class="stamp hit">임기<small>완료</small></div>
  </section>`;
  $("copyBtn").onclick = ()=>{ const txt=`[총장 시뮬레이터 정책 제안서]\n최종 지지율 ${S.sup}% · 예산 ${S.bud}억 · 학업 평판 ${S.aca}\n\n${report}`;
    navigator.clipboard.writeText(txt).then(()=>$("copyBtn").textContent="복사했습니다").catch(()=>{$("copyBtn").textContent="복사할 수 없어요";}); };
  if(EMBED) $("leaveBtn").onclick = ()=>tellGame("president-end", {sup:S.sup, bud:S.bud, aca:S.aca, verdict:v[0], agendas:S.log.length});
  $("againBtn").onclick = ()=>{ AGENDAS = drawAgendas(); Object.assign(S,{i:0,sup:52,bud:20,aca:60,hist:[52],log:[],pos:0,neg:0,busy:false,prevPosts:[]}); lastD={sup:0,bud:0,aca:0}; renderGauges(); renderDoc(); };
  drawSup(); addEventListener("resize", drawSup);
  window.scrollTo({top:0,behavior:"smooth"});
}
function drawSup(){
  const c=$("supChart"); if(!c) return; const dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight; if(!w) return;
  c.width=w*dpr; c.height=h*dpr; const g=c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const pad={l:30,r:12,t:12,b:24}, n=S.hist.length, x=i=>pad.l+i/(n-1)*(w-pad.l-pad.r), y=v=>pad.t+(1-v/100)*(h-pad.t-pad.b);
  g.font="11px 'IBM Plex Mono', monospace"; g.fillStyle=css("--muted"); g.strokeStyle=css("--rule"); g.lineWidth=1; g.textBaseline="middle";
  [0,50,100].forEach(v=>{ g.beginPath(); g.moveTo(pad.l,y(v)+.5); g.lineTo(w-pad.r,y(v)+.5); g.stroke(); g.fillText(v,4,y(v)); });
  g.beginPath(); S.hist.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v))); g.strokeStyle=css("--seal"); g.lineWidth=2.5; g.stroke();
  S.hist.forEach((v,i)=>{ g.beginPath(); g.arc(x(i),y(v),4,0,Math.PI*2); g.fillStyle=css("--seal"); g.fill(); });
  g.fillStyle=css("--muted"); g.textAlign="center"; g.textBaseline="alphabetic";
  S.hist.forEach((v,i)=>g.fillText(i?`안건${i}`:"취임",x(i),h-6));
}

// ── 게임(iframe 부모)과 연결
const EMBED = window.parent !== window;
function tellGame(type, data){ window.parent.postMessage({type, ...data}, location.origin); }
if(EMBED){ $("exitBtn").hidden=false; $("exitBtn").onclick=()=>tellGame("president-exit", {agendas:S.log.length}); }

renderGauges(); renderDoc();
</script>

</body>
</html>
